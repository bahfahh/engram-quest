  const barA = rect(P, BX[0] - BW / 2, base, BW, 0, { rx: 10, fill: C.blue }), barB = rect(P, BX[1] - BW / 2, base, BW, 0, { rx: 10, fill: C.green });
  const axisD = el('line', { x1: 960, y1: base + 6, x2: 1640, y2: base + 6, stroke: C.chalk, 'stroke-width': 7, 'stroke-linecap': 'round' }, P);
  const nA = text(P, '', { x: BX[0], y: 0, size: 76, fill: C.chalk }), nB = text(P, '', { x: BX[1], y: 0, size: 76, fill: C.chalk });
  const star = g(P); icon(star, 'star', { x: 0, y: 0, size: 78, color: C.yellow, sw: 2.4 }); star.firstChild.setAttribute('fill', C.yellow);
  const gaugeD = gauge(P, BX[0], 372, 78); const gLab = text(P, 'felt surest', { x: BX[0], y: 262, size: 44, fill: C.yellow });
  // times
  const tL1 = L('E1').start, tReA = L('E2a').start, tClose = W('E2b', 'closed'), tWrite = W('E2b', 'wrote');
  const tE3 = L('E3').start, tE81 = W('E3', 'eighty'), tE75 = W('E3', 'seventy'), tFlip = L('E4a').start, tE4b = L('E4b').start, tE56 = W('E4b', 'fifty'), tE42 = W('E4b', 'forty'), tE5 = L('E5a').start, tFelt = W('E5a', 'felt');
  const posA = [1000, 500], posB = [1470, 500], miniA = [BX[0], 775], miniB = [BX[1], 775], ms = 0.25;
  on(t => {
    show(axisD, t, tE3 - 0.4, 1e9, 0.3);
    // titles
    show(title0, t, tL1 - 0.2, tE3 - 0.5, 0.25); show(title, t, tE3 - 0.4, tFlip + 0.5, 0.25); show(title2, t, tFlip + 0.3, 1e9, 0.3);
    // cards: arrive, re-read / recall, then shrink into the bar labels

    const place = (c, p, m, dy) => { const x = lerp(p[0], m[0], shr), y = lerp(p[1] + (1 - arr) * -80, m[1], shr), s = lerp(1, ms, shr); c.setAttribute('transform', `translate(${x} ${y}) scale(${s})`); c.setAttribute('opacity', arr.toFixed(3)); c.style.display = arr <= 0 ? 'none' : ''; };
    place(cardA, posA, miniA); place(cardB, posB, miniB);

    const rA = prog(t, tReA - 0.05, tReA + 0.3), cl = ease.out(prog(t, tClose - 0.05, tClose + 0.4)), wr = prog(t, tWrite - 0.1, tWrite + 0.5);
    eyeA1.setAttribute('opacity', 1 - rA); repA.setAttribute('opacity', rA); eyeB1.setAttribute('opacity', 1 - cl);
    lid.setAttribute('transform', `translate(0 ${(-1 + cl) * 380 * (wr > 0 ? 1 : 1)})`); lid.setAttribute('opacity', (cl * (1 - wr)).toFixed(3)); lid.style.display = (cl <= 0 || wr >= 1) ? 'none' : '';
    pad.setAttribute('opacity', wr.toFixed(3)); pad.style.display = wr <= 0 ? 'none' : ''; pen.setAttribute('opacity', wr.toFixed(3)); pen.style.display = wr <= 0 ? 'none' : '';
    scrib.setAttribute('pathLength', 1); scrib.setAttribute('stroke-dasharray', '1 1'); scrib.setAttribute('stroke-dashoffset', (1 - prog(t, tWrite, tWrite + 1.6)).toFixed(3)); scrib.setAttribute('opacity', wr.toFixed(3)); scrib.style.display = wr <= 0 ? 'none' : '';
    // labels under the shrunk cards

    labA.setAttribute('opacity', prog(t, tReA, tReA + 0.3)); labB.setAttribute('opacity', prog(t, tClose, tClose + 0.3));

    const gA = t < tFlip ? 81 * ease.out(prog(t, tE81, tE81 + 0.7)) : lerp(81, 42, ease.inOut(prog(t, tFlip + 0.1, tFlip + 1.3)));
    const gB = t < tFlip ? 75 * ease.out(prog(t, tE75, tE75 + 0.7)) : lerp(75, 56, ease.inOut(prog(t, tFlip + 0.1, tFlip + 1.3)));
    const setBar = (b, n, v, cx, show_) => { const h = v * per; b.setAttribute('y', base - h); b.setAttribute('height', Math.max(0, h)); b.style.display = v < 0.5 ? 'none' : '';
      n.setAttribute('y', base - h - 22); n.textContent = Math.round(v) + '%'; n.style.display = (v < 0.5 || !show_) ? 'none' : ''; };
    setBar(barA, nA, gA, BX[0], t >= tE81 + 0.3); setBar(barB, nB, gB, BX[1], t >= tE75 + 0.3);
    // star on the winner (moves across at the flip)
    const sx = lerp(BX[0], BX[1], ease.inOut(prog(t, tFlip + 0.6, tFlip + 1.4))), sy = base - lerp(gA, gB, ease.inOut(prog(t, tFlip + 0.6, tFlip + 1.4))) * per - 150;
    const wA = t < tFlip + 0.6 ? gA : lerp(gA, gB, 0); // star hovers over the taller bar
    const taller = Math.max(gA, gB); star.setAttribute('transform', `translate(${sx + 135} ${base - taller * per - 40})`); star.setAttribute('opacity', (prog(t, tE75 + 0.8, tE75 + 1.1)).toFixed(3)); star.style.display = t < tE75 + 0.8 ? 'none' : '';
    // felt surest: the same gauge as before, above the re-read bar
    const gv = prog(t, tE5 - 0.1, tE5 + 0.5); gaugeD.setAttribute('opacity', gv.toFixed(3)); gaugeD.style.display = gv <= 0 ? 'none' : ''; gaugeD.set(0.9 * ease.out(prog(t, tFelt - 0.1, tFelt + 0.7)) + 0.02);
    gLab.setAttribute('opacity', gv.toFixed(3)); gLab.style.display = gv <= 0 ? 'none' : '';
  });
}

// ================================================================= PANEL E — what to do: close it, recall it, come back at growing gaps (FSRS automates)
{ const P = PE.g;
  const xs = [905, 1260, 1615];
  const step = (cx) => { const s = g(P); rect(s, cx - 150, 150, 300, 300, { rx: 26, fill: '#F7F6F2' }); return s; };
  const s1 = step(xs[0]), s2 = step(xs[1]), s3 = step(xs[2]);
  // 1: the answer, then the lid
  rect(s1, xs[0] - 110, 190, 220, 56, { rx: 16, fill: '#2F6FE0' });
  for (let i = 0; i < 3; i++) rect(s1, xs[0] - 110, 270 + i * 40, i === 2 ? 130 : 220, 16, { rx: 8, fill: '#C9C5BA' });
  const lid = g(s1); rect(lid, xs[0] - 150, 150, 300, 300, { rx: 26, fill: '#33415C' }); icon(lid, 'eye-off', { x: xs[0], y: 300, size: 110, color: '#F7F6F2', sw: 2 });
  // 2: from memory
  const brain = icon(s2, 'brain', { x: xs[1], y: 300, size: 150, color: '#2F6FE0', sw: 1.8 });
  const dots = [0, 1, 2].map(i => el('circle', { cx: xs[1] - 36 + i * 36, cy: 215, r: 10, fill: '#7A8499' }, s2));
  // 3: later
  icon(s3, 'calendar-clock', { x: xs[2], y: 300, size: 150, color: '#2F6FE0', sw: 1.8 });
  const l1 = text(P, 'CLOSE', { x: xs[0], y: 520, size: 54, fill: C.blue }), l2 = text(P, 'RECALL', { x: xs[1], y: 520, size: 54, fill: C.green }), l3 = text(P, 'RETURN', { x: xs[2], y: 520, size: 54, fill: C.yellow });
  // timeline with growing gaps
  const ty = 700, tl = el('path', { d: 'M 720 700 L 1800 700 M 1778 682 L 1800 700 L 1778 718', fill: 'none', stroke: C.chalk, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, P);
  const gaps = [0, 1, 2.3, 4.2, 7.0]; const gx = i => 770 + gaps[i] / 7 * 880;
  const arcs = [], pts = gaps.map((_, i) => { const c = el('circle', { cx: gx(i), cy: ty, r: 20, fill: i === 0 ? C.blue : C.green }, P); return c; });
  for (let i = 1; i < gaps.length; i++) arcs.push(el('path', { d: `M ${gx(i - 1)} ${ty - 28} Q ${(gx(i - 1) + gx(i)) / 2} ${ty - 28 - 40 - i * 12} ${gx(i)} ${ty - 28}`, fill: 'none', stroke: C.dim, 'stroke-width': 5, 'stroke-linecap': 'round' }, P));
  const chip = g(P); rect(chip, 1100, 770, 440, 84, { rx: 42, fill: C.blue }); text(chip, 'FSRS', { x: 1320, y: 830, size: 56, fill: '#12304F' });
  const tA = L('P1a').start, tB = L('P1b').start, tC = L('P1c').start, tF = W('P2', 'FSRS');
  on(t => { show(s1, t, tA - 0.1, 1e9, 0.3); show(s2, t, tB - 0.15, 1e9, 0.3); show(s3, t, tC - 0.15, 1e9, 0.3);
    show(l1, t, tA + 0.5); show(l2, t, tB + 0.3); show(l3, t, tC + 0.4);
    const cl = ease.out(prog(t, W('P1a', 'close') - 0.05, W('P1a', 'close') + 0.45)); lid.setAttribute('transform', `translate(0 ${(-1 + cl) * 300})`); lid.setAttribute('opacity', cl); lid.style.display = cl <= 0 ? 'none' : '';
    dots.forEach((d, i) => { const a = W('P1b', 'memory') - 0.4 + i * 0.22; d.setAttribute('opacity', (0.35 + 0.65 * Math.abs(Math.sin((t - a) * 5))).toFixed(2) * (t > a ? 1 : 0)); });
    show(tl, t, tC - 0.1, 1e9, 0.3);
    pts.forEach((p, i) => { const a = lerp(tC + 0.25, tC + 1.9, i / 4); const k = ease.outBack(prog(t, a, a + 0.3)); p.setAttribute('transform', `translate(${gx(i)} ${ty}) scale(${Math.max(0.001, k)}) translate(${-gx(i)} ${-ty})`); p.style.display = k <= 0 ? 'none' : '';
      if (i) { arcs[i - 1].setAttribute('pathLength', 1); arcs[i - 1].setAttribute('stroke-dasharray', '1 1'); arcs[i - 1].setAttribute('stroke-dashoffset', (1 - prog(t, a - 0.2, a + 0.15)).toFixed(3)); arcs[i - 1].style.display = t < a - 0.2 ? 'none' : ''; }
      if (i) p.setAttribute('fill', t > tF + 0.2 + i * 0.12 ? C.blue : C.green); });
    pop(chip, t, tF - 0.05, 1320, 812);
  });
}

// ================================================================= PANEL F — recap: every recall lifts the curve and flattens it
{ const P = PF.g; const AX = { x0: 800, x1: 1790, yb: 720, yt: 220 };
  const TOT = 10.6; const px = x => AX.x0 + x / TOT * (AX.x1 - AX.x0), py = v => AX.yb - v * (AX.yb - AX.yt);
  el('path', { d: `M ${AX.x0} ${AX.yt - 20} L ${AX.x0} ${AX.yb} L ${AX.x1 + 10} ${AX.yb}`, fill: 'none', stroke: C.chalk, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, P);
  const segs = [[0, 1.3, 0.5], [1.3, 3.6, 1.3], [3.6, 7.5, 3.2], [7.5, TOT, 9]]; // start, end, tau (decay slows each time)
  const val = (s, x) => 0.12 + 0.88 * Math.exp(-(x - s[0]) / s[2]);
  const segPaths = segs.map((s, i) => { let d = ''; for (let k = 0; k <= 40; k++) { const x = lerp(s[0], s[1], k / 40); d += `${k ? 'L' : 'M'} ${px(x).toFixed(1)} ${py(val(s, x)).toFixed(1)} `; }
    return el('path', { d, fill: 'none', stroke: i === 0 ? C.pink : C.green, 'stroke-width': 11, 'stroke-linecap': 'round' }, P); });
  const jumps = [1, 2, 3].map(i => { const x = segs[i][0]; const j = g(P); el('line', { x1: px(x), y1: py(val(segs[i - 1], x)), x2: px(x), y2: py(1), stroke: C.yellow, 'stroke-width': 7, 'stroke-dasharray': '10 10' }, j);
    el('circle', { cx: px(x), cy: py(1), r: 18, fill: C.yellow }, j); icon(j, 'brain', { x: px(x), y: py(1) - 62, size: 64, color: C.yellow, sw: 2 }); return j; });
  const start = g(P); el('circle', { cx: px(0), cy: py(1), r: 18, fill: C.blue }, start); icon(start, 'eye', { x: px(0) + 62, y: py(1) - 12, size: 64, color: C.blue, sw: 2 });
  text(P, 'time', { x: 1290, y: 800, size: 46, fill: C.blue }); text(P, 'schematic curve', { x: 1800, y: 840, size: 34, fill: '#D9E3DE', anchor: 'end', cls: 'ui', weight: 600 });
  const lg1 = text(P, 'read', { x: px(0) + 120, y: py(1) + 62, size: 40, fill: C.blue, anchor: 'start' }), lg2 = text(P, 'recall', { x: px(segs[1][0]) + 30, y: py(1) + 130, size: 40, fill: C.yellow, anchor: 'start' });
  const t0 = L('R1').start, tR = [W('R2', 'Pulling'), W('R2', 'little'), W('R2', 'each')], tEnd = L('R2').end;
  on(t => { show(start, t, t0 - 0.1, 1e9, 0.25); show(lg1, t, t0 + 0.1, 1e9, 0.25); show(lg2, t, tR[0] + 0.2, 1e9, 0.25);
    lineReveal(segPaths[0], t, t0 + 0.1, t0 + 1.25);
    [1, 2, 3].forEach(i => { const a = tR[i - 1]; pop(jumps[i - 1], t, a, px(segs[i][0]), py(1)); lineReveal(segPaths[i], t, a + 0.15, i === 3 ? tEnd - 0.15 : a + 1.0); });
  });
}

// ================================================================= END CARD
const end = g(svg); const tCard = T.duration - 3.6;
rect(end, 0, 0, 1920, 1080, { fill: C.navy });
{ const gg = g(end); el('circle', { cx: 1500, cy: 250, r: 360, fill: '#1B2E4D', opacity: 0.6 }, gg); el('circle', { cx: 1650, cy: 820, r: 240, fill: '#1B2E4D', opacity: 0.5 }, gg); }
text(end, 'Made from one note in Obsidian,', { x: 720, y: 480, size: 64, fill: '#FFFFFF', cls: 'ui', weight: 700, anchor: 'start' });
text(end, 'by Claude Code.', { x: 720, y: 565, size: 64, fill: '#FFFFFF', cls: 'ui', weight: 700, anchor: 'start' });
rect(end, 720, 612, 220, 6, { rx: 3, fill: C.gold });
text(end, 'EngramQuest: an Obsidian plugin', { x: 720, y: 700, size: 48, fill: C.gold, cls: 'ui', weight: 600, anchor: 'start' });

// ================================================================= the teacher (Nico, glossy-bot) on top
const st = await makeStage({ card: false, transparent: true });
const skinMod = await import((await import('/lib/cast/skin-url.js')).skinUrl('glossy-bot'));
const cast = await skinMod.create(st.env, { variant: 'classic' });
st.adopt(cast);
st.place(cast.student, -3000, 0, 10, { visible: false }); st.place(cast.embodiment, -3000, 0, 10, { visible: false });
const NICO = { x: 330, y: 880, px: 560 }, NICO_END = { x: 420, y: 930, px: 700 };
const win = (t, a, b, e = 0.2) => Math.min(prog(t, a, a + e), 1 - prog(t, b - e, b));
// what Nico does when (point at the board / think / doubt / aha)
const POINTS = [[L('I1b').start, L('I1b').end], [W('I4a', 'Memory'), L('I4a').end], [L('E2a').start, L('E2b').end], [L('E3').start, L('E4b').end], [L('P1a').start, L('P1c').end], [L('R2').start, L('R2').end]];
const STATES = [['think', L('Q2').start - 0.1, L('Q2').end + 0.5], ['doubt', W('I3', 'exact') - 0.2, L('I4a').start], ['aha', L('E4a').start + 0.2, L('E4a').end + 1.0], ['doubt', L('E5b').start - 0.2, L('E5b').end + 0.3], ['aha', W('R2', 'stick') - 0.4, L('R2').end + 0.8]];
window.DURATION = T.duration;
window.renderAt = t => {
  layoutPanels(t);
  for (const f of UPD) f(t);
  const sh = prog(t, tCard - 0.4, tCard);                       // end card fades in
  end.setAttribute('opacity', sh.toFixed(3)); end.style.display = sh <= 0 ? 'none' : '';
  const lay = sh > 0 ? { x: lerp(NICO.x, 330, ease.inOut(sh)), y: lerp(NICO.y, 930, ease.inOut(sh)), px: lerp(NICO.px, 640, ease.inOut(sh)) } : NICO;
  const p = { t, blink: ((t + 0.7) % 3.3) < 0.13 ? Math.sin(((t + 0.7) % 3.3) / 0.13 * Math.PI) : 0, lookX: 0.35, lookY: 0, talk: S.mouth(T, 'teacher', t), armL: 0, armR: 0, point: 0, wave: 0, hop: 0, squash: 0.012 * Math.sin(t * 2.1), tilt: 0, turn: 0.12, state: 'idle', stateK: 0 };
  let pt = 0; for (const [a, b] of POINTS) pt = Math.max(pt, win(t, a - 0.15, b + 0.1, 0.3)); p.point = pt * 0.95; p.lookX = 0.35 + 0.45 * pt; p.turn = 0.12 + 0.2 * pt; p.talk = Math.min(1, p.talk * 1.1);
  for (const [s, a, b] of STATES) { const k = win(t, a, b, 0.35); if (k > (p.stateK || 0)) { p.state = s; p.stateK = k; } }
  if (p.state === 'aha') p.hop = 0.25 * p.stateK * Math.max(0, Math.sin((t - T.duration) * 7)) * 0;
  if (sh > 0.01) { p.state = 'aha'; p.stateK = sh; p.wave = sh; p.armR = Math.max(p.armR, sh); p.point = 0; p.lookX = 0; p.turn = 0.0; p.talk = 0.1; }
  st.place(cast.teacher, lay.x, lay.y, lay.px); cast.teacher.pose(p);
  st.render();
};
window.studioReady = Promise.resolve();
