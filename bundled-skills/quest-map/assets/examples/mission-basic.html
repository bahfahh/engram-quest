<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Example</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe3ef;--accent:#2563eb;--good:#16a34a;--bad:#dc2626}
body.dark{--bg:#0f172a;--card:#172033;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;padding:22px 18px 72px;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Noto Sans TC",system-ui,sans-serif;line-height:1.6}.wrap{max-width:760px;margin:0 auto}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}.option{display:block;width:100%;text-align:left;border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.option:hover:not(:disabled){border-color:var(--accent)}.option.ok{border-color:var(--good)}.option.bad{border-color:var(--bad)}.feedback{min-height:1.5em;color:var(--muted);margin-top:8px}
#finish-btn{display:none;margin-top:16px;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:1rem;font:inherit}
#finish-btn:hover{opacity:.88}
</style>
</head>
<body>
<main class="wrap">
  <h1>Mission: Pick the safer first move</h1>
  <div class="card">
    <p><strong>Situation.</strong> A new release doubled latency. Error rate is stable, but queue depth is rising.</p>
    <button class="option" data-score="100">Inspect queue consumers before rolling back.</button>
    <button class="option" data-score="45">Rollback immediately without checking queue state.</button>
    <button class="option" data-score="20">Scale the database first.</button>
    <p class="feedback" id="feedback"></p>
    <!-- Finish button: always show after feedback so the learner reads it before advancing -->
    <button id="finish-btn">完成關卡</button>
  </div>
</main>
<script>
function resize(){window.parent.postMessage({type:"engram-quest-resize",height:document.body.scrollHeight+24},"*")}
function solved(score){window.parent.postMessage({type:"engram-quest-solved",score},"*")}
window.addEventListener("message",e=>{if(e.data&&e.data.type==="engram-quest-theme"){document.body.classList.toggle("dark",!!e.data.dark);resize()}})

let finalScore=0;
document.querySelectorAll(".option").forEach(btn=>btn.addEventListener("click",()=>{
  finalScore=Number(btn.dataset.score);
  document.querySelectorAll(".option").forEach(b=>b.disabled=true);
  btn.classList.add(finalScore>=80?"ok":"bad");
  document.getElementById("feedback").textContent=finalScore>=80
    ?"✓ Good: the symptom points at consumer throughput — inspect before touching anything else."
    :"✗ Risky: rolling back or scaling DB hides the real bottleneck. Check consumers first.";
  // Show Finish button — do NOT call solved() here; let the learner read the feedback first.
  document.getElementById("finish-btn").style.display="inline-block";
  resize();
}));

document.getElementById("finish-btn").addEventListener("click",()=>solved(finalScore));
resize();
</script>
</body>
</html>
