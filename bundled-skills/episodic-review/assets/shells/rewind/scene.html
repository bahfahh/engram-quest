<script type="module">

const fade = D.fade, ek = (t, a, b) => ease(clamp((t - a) / (b - a)));
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ============================================================ fonts ============================================================ */
const allText = TXT.map(o => o.text).join('') + Object.values(UI).join('') + '0123456789一三上了交住倒做價內兩則參坪型好容尾帶建快成戶房數日月樓比沒浴片秒站第考萬衛規議較轉週頭';

/* ============================================================ world ============================================================ */
const W = build($('#gl'));
const { ST, cabins, signs, board, FY, trackPos, trackNormal, dayOfS } = W;
const P = (pos, tgt, fov = 46) => ({ pos, tgt, fov });
const mix = (A, B, k) => ({ pos: A.pos.clone().lerp(B.pos, k), tgt: A.tgt.clone().lerp(B.tgt, k), fov: lerp(A.fov, B.fov, k) });
const up = (v, y) => v.clone().setY(v.y + y);
const trainFwd = s => P(up(trackPos(s), 2.5), up(trackPos(s + 14), 1.9), 58);
const trainBack = s => P(up(trackPos(s), 2.5), up(trackPos(s - 14), 1.9), 58);
function monotone(xs, ys) {
  const n = xs.length, d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; } const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b; if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; } }
  return x => { if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1]; let i = 0; while (x > xs[i + 1]) i++;
    const hh = xs[i + 1] - xs[i], t = (x - xs[i]) / hh, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * hh * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * hh * m[i + 1]; };
}
const S1s = ST.s1.s, S2s = ST.s2.s, S3s = ST.s3.s;

/* ---------- station camera poses (in each cabin's local frame) ---------- */
const POSE = {};
for (const k of ['s1', 's2', 's3']) {
  const c = cabins[k], L = c.L, sc = c.screens[0];
  const noteC = c.note.reduce((a, v) => a.add(v), V(0, 0, 0)).multiplyScalar(0.25);
  const nl = c.g.worldToLocal(noteC.clone());
  const desk = (s) => { const lc = c.g.worldToLocal(s.center.clone()); const d = s.w / 0.72 / 1.294; return P(L(lc.x, lc.y - 0.12, -5.05 + d), L(lc.x, lc.y, -5.05), 40); };
  POSE[k] = {
    SIGN: P(up(trackPos(ST[k].s), 2.7), signs[k].center.clone(), 42),
    EXT: P(L(-5.5, 11, 18.5), L(0.4, 3.4, -2), 46),
    IN: P(L(1.1, FY + 2.55, 2.6), L(0.3, FY + 2.45, -5), 50),
    Q: P(L(nl.x + 0.95, nl.y - 0.05, -5.66 + 2.75), L(nl.x + 0.95, nl.y - 0.1, -5.66), 40),
    DESK: desk(sc),
    CORK: P(L(6.0, FY + 3.4, -5.6 + 4.3), L(6.0, FY + 3.4, -5.6), 40),
    WIDE: P(L(1.4, FY + 2.6, 2.4), L(0.8, FY + 2.5, -5.2), 50),
  };
}
POSE.s1.DESKR = (() => { const c = cabins.s1, s = c.screens[1]; const lc = c.g.worldToLocal(s.center.clone()); const d = s.w / 0.74 / 1.294; return P(c.L(lc.x, lc.y, -5.05 + d), c.L(lc.x, lc.y, -5.05), 40); })();
POSE.s1.DESK2 = (() => { const c = cabins.s1; const a = c.g.worldToLocal(c.screens[0].center.clone()), b = c.g.worldToLocal(c.screens[1].center.clone()); const cx = (a.x + b.x) / 2, cy = a.y; const span = (b.x - a.x) + 2.1; const d = span / 0.93 / 1.294; return P(c.L(cx, cy - 0.02, -5.05 + d), c.L(cx, cy - 0.02, -5.05), 40); })();
POSE.s1.PRINT = P(cabins.s1.L(6.0, FY + 4.12, -5.6 + 2.62), cabins.s1.L(6.0, FY + 4.12, -5.6), 40);
POSE.s2.ZOOM = (() => { const c = cabins.s2; const lc = c.g.worldToLocal(c.screens[0].center.clone()); return P(c.L(lc.x + 0.05, lc.y - 0.28, -5.05 + 1.9), c.L(lc.x + 0.05, lc.y - 0.28, -5.05), 40); })();
POSE.s2.DESKL = P(cabins.s2.L(-1.25, FY + 3.15, -2.55), cabins.s2.L(-1.95, FY + 1.62, -4.3), 44);
const drift = (A, dz, t, t0, t1) => { const k = clamp((t - t0) / (t1 - t0)); const d = A.tgt.clone().sub(A.pos).normalize().multiplyScalar(dz * k); return P(A.pos.clone().add(d), A.tgt.clone(), A.fov); };

/* ---------- overview, board, travel ---------- */
const P0 = trackPos(0);
const OV_A = P(V(P0.x + 230, 112, P0.z + 10), up(trackPos(230), -10).add(V(-70, 0, 0)), 50);
const OV_B = P(V(P0.x + 255, 128, P0.z - 40), up(trackPos(250), -14).add(V(-80, 0, 0)), 50);
const OV_END = P(V(P0.x + 285, 150, P0.z - 30), up(trackPos(240), -14).add(V(-80, 0, 0)), 50);
const BD = P(board.L(-0.3, 3.75, 6.0), board.L(0, 3.85, 0), 40), BD2 = P(board.L(0.25, 3.8, 5.7), board.L(0, 3.85, 0), 40);
const BD_IN = P(board.L(-3, 7, 18), board.L(0, 3.5, 0), 46);
const sRW = monotone([SEG.rw[0] + 2.2, SEG.rw[0] + 4, SEG.rw[1] - 3, SEG.rw[1] - 0.6], [-1, 12, S1s - 30, S1s - 0.4]);
const sFF1 = monotone([SEG.ff1[0] + 2, SEG.ff1[0] + 3.5, SEG.ff1[1] - 1.6, SEG.ff1[1]], [S1s, S1s - 12, S2s + 14, S2s + 0.3]);
const sFF2 = monotone([SEG.ff2[0] + 2, SEG.ff2[0] + 3.5, SEG.ff2[1] - 1.4, SEG.ff2[1]], [S2s, S2s - 6, S3s + 8, S3s + 0.3]);

const seg = (t0, t1, A, B, e = ease) => ({ t0, t1, A, B, e });
const id = k => k;
const SEQ = []; const add = (...a) => SEQ.push(seg(...a));
add(0, SEG.ov[0], OV_A, OV_A); add(SEG.ov[0], SEG.ov[1], OV_A, OV_B);
add(SEG.desc[0], SEG.desc[1] + 1.5, OV_B, BD_IN); add(SEG.desc[1] + 1.5, SEG.tt[0] + 3, BD_IN, BD); add(SEG.tt[0] + 3, SEG.tt[1], BD, BD2, id);
add(SEG.rw[0], SEG.rw[0] + 2.2, BD2, t => trainFwd(sRW(t))); add(SEG.rw[0] + 2.2, SEG.rw[1], t => trainFwd(sRW(t)), t => trainFwd(sRW(t)), id);
// a station visit, shared shape
function visit(k, B, arriveCam, extra) {
  const p = POSE[k];
  add(B.arr, B.arr + 1.4, arriveCam, p.SIGN); add(B.arr + 1.4, B.arr + 6.0, p.SIGN, drift(p.SIGN, 0.8, 1, 0, 1), id);
  add(B.arr + 6.0, B.arr + 7.6, drift(p.SIGN, 0.8, 1, 0, 1), p.EXT); add(B.arr + 7.6, B.q - 0.4, p.EXT, p.IN); add(B.q - 0.4, B.q + 0.8, p.IN, p.Q); add(B.q + 0.8, B.q + 5.5, p.Q, drift(p.Q, 0.15, 1, 0, 1), id); /* reach the question note early and keep it in focus until the next beat */
  extra(p);
}
visit('s1', B1, trainFwd(S1s - 0.4), p => {
  add(B1.five, B1.five + 1.5, drift(p.Q, 0.15, 1, 0, 1), p.DESKR); add(B1.five + 1.5, B1.cork, p.DESKR, drift(p.DESKR, 0.2, 1, 0, 1), id);
  add(B1.cork, B1.cork + 1.8, drift(p.DESKR, 0.2, 1, 0, 1), p.PRINT); add(B1.cork + 1.8, B1.ugly, p.PRINT, drift(p.PRINT, 0.15, 1, 0, 1), id);
  add(B1.ugly, B1.ugly + 1.6, drift(p.PRINT, 0.15, 1, 0, 1), p.DESKR); add(B1.ugly + 1.6, B1.r1, p.DESKR, drift(p.DESKR, 0.18, 1, 0, 1), id);
  add(B1.r1, B1.r1 + 1.6, drift(p.DESKR, 0.18, 1, 0, 1), p.DESK2); add(B1.r1 + 1.6, B1.wrap, p.DESK2, drift(p.DESK2, 0.25, 1, 0, 1), id);
  add(B1.wrap, B1.wrap + 1.6, drift(p.DESK2, 0.25, 1, 0, 1), p.CORK); add(B1.wrap + 1.6, B1.out, p.CORK, drift(p.CORK, 0.15, 1, 0, 1), id);
});
add(SEG.ff1[0], SEG.ff1[0] + 1.1, drift(POSE.s1.CORK, 0.15, 1, 0, 1), POSE.s1.EXT); add(SEG.ff1[0] + 1.1, SEG.ff1[0] + 2, POSE.s1.EXT, trainBack(S1s)); /* leave through the open front: a straight move went through the wall */ add(SEG.ff1[0] + 2, SEG.ff1[1], t => trainBack(sFF1(t)), t => trainBack(sFF1(t)), id);
visit('s2', B2, trainBack(S2s + 0.3), p => {
  add(B2.cse, B2.cse + 1.5, drift(p.Q, 0.15, 1, 0, 1), p.DESK); add(B2.cse + 1.5, B2.cse + 9, p.DESK, p.DESK, id);
  add(B2.cse + 9, B2.cse + 10.6, p.DESK, p.ZOOM); add(B2.cse + 10.6, B2.rows - 1.4, p.ZOOM, p.ZOOM, id); add(B2.rows - 1.4, B2.rows + 0.4, p.ZOOM, p.DESK);
  add(B2.rows + 0.4, B2.own, p.DESK, drift(p.DESK, 0.3, 1, 0, 1), id);
  add(B2.own, B2.own + 1.2, drift(p.DESK, 0.3, 1, 0, 1), p.DESKL); add(B2.own + 1.2, B2.own + 2.4, p.DESKL, p.DESKL, id); add(B2.own + 2.4, B2.own + 3.8, p.DESKL, p.DESK); add(B2.own + 3.8, B2.wrap, p.DESK, drift(p.DESK, 0.2, 1, 0, 1), id);
  add(B2.wrap, B2.wrap + 1.6, drift(p.DESK, 0.2, 1, 0, 1), p.CORK); add(B2.wrap + 1.6, B2.out, p.CORK, drift(p.CORK, 0.15, 1, 0, 1), id);
});
add(SEG.ff2[0], SEG.ff2[0] + 1.1, drift(POSE.s2.CORK, 0.15, 1, 0, 1), POSE.s2.EXT); add(SEG.ff2[0] + 1.1, SEG.ff2[0] + 2, POSE.s2.EXT, trainBack(S2s)); /* leave through the open front */ add(SEG.ff2[0] + 2, SEG.ff2[1], t => trainBack(sFF2(t)), t => trainBack(sFF2(t)), id);
visit('s3', B3, trainBack(S3s + 0.3), p => {
  add(B3.v1, B3.v1 + 1.5, drift(p.Q, 0.15, 1, 0, 1), p.DESK); add(B3.v1 + 1.5, B3.wrap, p.DESK, drift(p.DESK, 0.35, 1, 0, 1), id);
  add(B3.wrap, B3.wrap + 1.6, drift(p.DESK, 0.35, 1, 0, 1), p.CORK); add(B3.wrap + 1.6, B3.out, p.CORK, drift(p.CORK, 0.15, 1, 0, 1), id);
});
add(SEG.qz[0], SEG.qz[1], drift(POSE.s3.CORK, 0.15, 1, 0, 1), POSE.s3.WIDE, id);
add(SEG.end[0], DURATION + 1, OV_B, OV_END, k => ease(k));
const ev = (A, t) => (typeof A === 'function' ? A(t) : A);
function camAt(t) {
  let sg = SEQ[SEQ.length - 1]; for (const s of SEQ) if (t >= s.t0 && t < s.t1) { sg = s; break; }
  return mix(ev(sg.A, t), ev(sg.B, t), sg.e(clamp((t - sg.t0) / (sg.t1 - sg.t0))));
}
// depth of field and focus target follow the same beats
function focusAt(t) {
  const st = t < SEG.s1[0] ? null : t < SEG.ff1[0] + 1 ? 's1' : t < SEG.s2[0] - 1 ? null : t < SEG.ff2[0] + 1 ? 's2' : t < SEG.s3[0] - 1 ? null : t < SEG.qz[0] + 2 ? 's3' : null;
  if (!st) return { st, on: null, dof: 0 };

  const inside = sstep(B.q - 1.6, B.q, t) * (1 - sstep(B.out, B.out + 1.5, t));
  let on = 'screen';
  if (t < B.q + 5.6) on = 'note'; // the question note stays sharp for its whole beat (was q+1.2: only ~2 s readable)
  if (st === 's1' && t >= B1.cork + 0.8 && t < B1.ugly + 0.8) on = 'cork';
  if (t >= B.wrap + 0.8) on = 'cork';
  if (st === 's2' && t >= B2.own + 0.6 && t < B2.own + 3.2) on = 'desk';

/* ============================================================ world clock (leaves fly back up while rewinding) ============================================================ */
const RATE = t => { let r = 1; const band = (a, b, v, f = 0.6) => { const w = sstep(a - f, a + f, t) * (1 - sstep(b - f, b + f, t)); r = lerp(r, v, w); };
  band(SEG.rw[0] + 1.5, SEG.rw[1] - 0.6, -6); band(SEG.ff1[0] + 2, SEG.ff1[1] - 0.4, 4); band(SEG.ff2[0] + 2, SEG.ff2[1] - 0.4, 4);
  for (const B of [B1, B2, B3]) band(B.cd[0] - 4, B.cd[1], 0.15, 0.4); return r; };
const WT = new Float32Array(Math.ceil(DURATION * 100) + 2); { let w = 0; for (let i = 0; i < WT.length; i++) { WT[i] = w; w += RATE(i / 100) / 100; } }
const Wclock = t => { const x = clamp(t, 0, DURATION) * 100, i = Math.floor(x); return lerp(WT[i], WT[Math.min(i + 1, WT.length - 1)], x - i); };

/* ============================================================ sky, sun, lights ============================================================ */
function skyAt(t) {
  const K = [[0, 'night'], [SEG.rw[0] + 2, 'night'], [SEG.rw[0] + 6.5, 'dusk'], [SEG.rw[1] - 1.5, 'golden'], [SEG.ff1[0] + 2, 'golden'], [SEG.ff1[1] - 1, 'dusk'], [B2.rec - 4, 'dusk'], [B2.own + 6, 'blue'], [SEG.ff2[0] + 2, 'blue'], [SEG.ff2[1] - 1, 'night'], [SEG.qz[0] + 0.3, 'night'], [SEG.qz[0] + 1.8, 'void'], [SEG.end[0], 'void'], [SEG.end[0] + 1.8, 'night'], [DURATION + 1, 'night']];
  for (let i = 0; i < K.length - 1; i++) if (t >= K[i][0] && t < K[i + 1][0]) return { a: K[i][1], b: K[i + 1][1], k: sstep(K[i][0], K[i + 1][0], t) };
  return { a: 'night', b: 'night', k: 0 };
}
const localDir = (k, x, y, z) => { const g = cabins[k].g; return g.localToWorld(V(x, y, z)).sub(g.position).normalize(); };
const SUN = { s1: localDir('s1', 0.3, 0.34, -1), s2: localDir('s2', 0.5, 0.13, -1), s3: localDir('s3', -0.35, 0.58, -1), ov: V(-0.35, 0.55, -0.75).normalize() };
const LIGHT = { s1: { lampI: 4, lampG: 0.2, screenI: 2.5, shaft: 0.42, sun: 1.5 }, s2: { lampI: 16, lampG: 0.8, screenI: 4, shaft: 0.16, sun: 2.4 }, s3: { lampI: 18, lampG: 0.9, screenI: 6, shaft: 0.14, sun: 1.3 } };
const recallDark = t => Math.max(fade(t, B1.rec, B1.rev, 0.9, 0.9), fade(t, B2.rec, B2.rev + 0.3, 0.9, 0.9), fade(t, B3.rec + 3.2, B3.rev, 0.9, 0.9));

/* ============================================================ overlays ============================================================ */
const paperL = $('#paper'), screenL = $('#screens');
