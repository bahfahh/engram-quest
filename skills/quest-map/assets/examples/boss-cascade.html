<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Cascade Example</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe3ef;--accent:#4f46e5;--good:#16a34a;--warn:#d97706;--bad:#dc2626}
body.dark{--bg:#0f172a;--card:#172033;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;--accent:#818cf8}
*{box-sizing:border-box}body{margin:0;padding:22px 18px 72px;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Noto Sans TC",system-ui,sans-serif;line-height:1.6}.wrap{max-width:820px;margin:0 auto}.metric{display:inline-block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:4px}.warn{display:none;border-left:4px solid var(--warn);background:rgba(217,119,6,.12);padding:10px 12px;border-radius:8px;margin:10px 0}.warn.show{display:block}.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}.choice{display:block;width:100%;text-align:left;border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
</style>
</head>
<body>
<main class="wrap">
  <h1>Boss: Cascading Recovery</h1>
  <div><span class="metric">Latency: <b id="lat">620 ms</b></span><span class="metric">Queue: <b id="queue">8k</b></span></div>
  <div id="warn" class="warn"></div>
  <section class="panel" id="stage"></section>
</main>
<script>
const state={score:0,poorFirst:false,stage:0};
const stages=[
  {q:"Stage 1: What do you check first?",opts:[["Consumer logs and queue age",50],["Database scale settings",15]]},
  {q:"Stage 2: What mitigation is safest now?",opts:[["Pause producer burst and add consumers",50],["Restart the database",10]]}
];
function resize(){window.parent.postMessage({type:"engram-quest-resize",height:document.body.scrollHeight+24},"*")}
function solved(){window.parent.postMessage({type:"engram-quest-solved",score:state.score},"*")}
function render(){const s=stages[state.stage],el=document.getElementById("stage");el.innerHTML=`<h2>${s.q}</h2>`;s.opts.forEach(([label,score],i)=>{const b=document.createElement("button");b.className="choice";b.textContent=label;b.onclick=()=>pick(score,i);el.appendChild(b)});resize()}
function pick(score,index){state.score+=score;if(state.stage===0&&index===1){state.poorFirst=true;document.getElementById("lat").textContent="910 ms";document.getElementById("queue").textContent="14k";const w=document.getElementById("warn");w.textContent="Your first move delayed queue diagnosis. The backlog is worse in stage 2.";w.classList.add("show")}state.stage++;if(state.stage>=stages.length){document.getElementById("stage").innerHTML=`<h2>Recovery complete</h2><p>Score: ${state.score}</p><button class="choice" id="finish">Finish boss</button>`;document.getElementById("finish").onclick=solved}else render();resize()}
window.addEventListener("message",e=>{if(e.data&&e.data.type==="engram-quest-theme"){document.body.classList.toggle("dark",!!e.data.dark);resize()}});
render();
</script>
</body>
</html>
